<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التسجيل في برنامج | الفردوس الأعلى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="enroll">
<header class="top">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span data-i18n="brand">الفردوس الأعلى</span></a>
  <div class="actions" style="margin-inline-start:auto">
    <button class="lang" id="langBtn" type="button">English</button>
    <a class="btn ghost" href="account.html" data-i18n="nav_account">حسابي</a>
  </div>
</header>
<main class="auth-wrap stack">
  <form id="form" class="auth-card wide" novalidate>
    <h1 data-i18n="enroll_h">التسجيل في برنامج</h1>
    <p class="meta" data-i18n="enroll_intro">اختر البرنامج وابعت طلبك. الأكاديمية هتتواصل معاك لتأكيد التسجيل وترتيب الدفع.</p>
    <label><span data-i18n="e_program">البرنامج</span>
      <select id="program"></select></label>
    <label><span id="studentLabel">اسم الطالب</span>
      <input id="student_name" type="text" maxlength="100"></label>
    <label><span data-i18n="e_notes">ملاحظات (اختياري)</span>
      <textarea id="notes" maxlength="500"></textarea></label>
    <button class="btn big" id="submit" type="submit" data-i18n="e_send">إرسال الطلب</button>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
  </form>
  <section class="auth-card wide">
    <h2 data-i18n="e_my">طلباتي</h2>
    <div id="myList" class="rows"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
<script src="auth.js"></script>
<script src="enroll.js"></script>
</body>
</html>
