<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إعادة تعيين كلمة المرور | الفردوس الأعلى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="reset">
<header class="top">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span data-i18n="brand">الفردوس الأعلى</span></a>
  <div class="actions" style="margin-inline-start:auto">
    <button class="lang" id="langBtn" type="button">English</button>
    <a class="btn ghost" href="login.html" data-i18n="login">تسجيل الدخول</a>
  </div>
</header>
<main class="auth-wrap">
  <div class="auth-card">
    <h1 data-i18n="reset_h">إعادة تعيين كلمة المرور</h1>
    <form id="form" novalidate>
      <p class="meta" data-i18n="reset_sub">اكتب بريدك الإلكتروني وهنبعت لك رابط لاختيار كلمة مرور جديدة.</p>
      <label><span data-i18n="f_email">البريد الإلكتروني</span>
        <input id="email" type="email" autocomplete="email" dir="ltr" required></label>
      <button class="btn big" type="submit" data-i18n="send_link">إرسال الرابط</button>
    </form>
    <form id="newForm" hidden novalidate>
      <h2 data-i18n="new_pass_h">اختر كلمة مرور جديدة</h2>
      <label><span data-i18n="new_pass">كلمة المرور الجديدة (8 حروف أو أكتر)</span>
        <input id="newpass" type="password" autocomplete="new-password" minlength="8" dir="ltr"></label>
      <label><span data-i18n="new_pass2">أعد كتابة كلمة المرور الجديدة</span>
        <input id="newpass2" type="password" autocomplete="new-password" dir="ltr"></label>
      <button class="btn big" type="submit" data-i18n="save_pass">حفظ كلمة المرور</button>
    </form>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
<script src="auth.js"></script>
</body>
</html>
