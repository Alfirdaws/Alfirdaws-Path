<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنشاء حساب | الفردوس الأعلى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="register">
<header class="top">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span data-i18n="brand">الفردوس الأعلى</span></a>
  <div class="actions" style="margin-inline-start:auto">
    <button class="lang" id="langBtn" type="button">English</button>
    <a class="btn ghost" href="login.html" data-i18n="login">تسجيل الدخول</a>
  </div>
</header>
<main class="auth-wrap">
  <form id="form" class="auth-card" novalidate>
    <h1 data-i18n="reg_h">إنشاء حساب جديد</h1>
    <label><span data-i18n="f_name">الاسم الكامل</span>
      <input id="full_name" type="text" autocomplete="name" required></label>
    <label><span data-i18n="f_role">أنا</span>
      <select id="role"><option value="student" data-i18n="r_student">طالب</option><option value="parent" data-i18n="r_parent">ولي أمر</option></select></label>
    <label><span data-i18n="f_phone">رقم الموبايل (واتساب)</span>
      <input id="phone" type="tel" autocomplete="tel" dir="ltr" required></label>
    <label><span data-i18n="f_email">البريد الإلكتروني</span>
      <input id="email" type="email" autocomplete="email" dir="ltr" required></label>
    <label><span data-i18n="f_pass">كلمة المرور (8 حروف أو أكتر)</span>
      <input id="password" type="password" autocomplete="new-password" minlength="8" dir="ltr" required></label>
    <label><span data-i18n="f_pass2">أعد كتابة كلمة المرور</span>
      <input id="password2" type="password" autocomplete="new-password" dir="ltr" required></label>
    <button class="btn big" id="submit" type="submit" data-i18n="reg_btn">إنشاء الحساب</button>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
    <p class="alt"><span data-i18n="have_acc">عندك حساب؟</span> <a href="login.html" data-i18n="login">تسجيل الدخول</a></p>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
<script src="auth.js"></script>
</body>
</html>
