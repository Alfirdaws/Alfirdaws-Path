<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | مسار الفردوس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
<header class="top">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span data-i18n="brand">مسار الفردوس</span></a>
  <div class="actions" style="margin-inline-start:auto">
    <button class="lang" id="langBtn" type="button">English</button>
    <a class="btn" href="register.html" data-i18n="register">سجّل الآن</a>
  </div>
</header>
<main class="auth-wrap">
  <form id="form" class="auth-card" novalidate>
    <h1 data-i18n="login_h">تسجيل الدخول</h1>
    <label><span data-i18n="f_email">البريد الإلكتروني</span>
      <input id="email" type="email" autocomplete="email" dir="ltr" required></label>
    <label><span data-i18n="f_pass_login">كلمة المرور</span>
      <input id="password" type="password" autocomplete="current-password" dir="ltr" required></label>
    <button class="btn big" id="submit" type="submit" data-i18n="login_btn">دخول</button>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
    <p class="alt"><span data-i18n="no_acc">ما عندكش حساب؟</span> <a href="register.html" data-i18n="register">سجّل الآن</a></p>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
<script src="auth.js"></script>
</body>
</html>
